spring:
  cloud:
    contract:
      stubrunner:
        cloud:
          enabled: false
  application:
    name: notifications-service
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          accounts-service:
            provider: keycloak
            client-id: notifications-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: customer:any:read
        provider:
          keycloak:
            token-uri: http://localhost/realms/my-bank/protocol/openid-connect/token

mybank:
  clients:
    base-urls:
      accounts-service: http://localhost:8082
