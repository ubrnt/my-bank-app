spring:
  application:
    name: front-service
    contract:
      stubrunner:
        cloud:
          enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: front-service
            client-secret: test-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            authorization-uri: http://localhost/realms/my-bank/protocol/openid-connect/auth
            token-uri: http://localhost/realms/my-bank/protocol/openid-connect/token
            jwk-set-uri: http://localhost/realms/my-bank/protocol/openid-connect/certs
            user-info-uri: http://localhost/realms/my-bank/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username

mybank:
  clients:
    base-urls:
      gateway: http://localhost:8081
