spring:
  application:
    name: accounts-service
  cloud:
    consul:
      enabled: false
  jackson:
    default-property-inclusion: non_null
  security:
    oauth2:
      client:
        registration:
          notifications:
            provider: keycloak
            client-id: accounts-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: notifications:write
        provider:
          keycloak:
            token-uri: http://localhost/realms/my-bank/protocol/openid-connect/token

mybank:
  outbox:
    enabled: false
    poll-interval: 5s
    batch-size: 20
    stale-timeout: 5m
    max-attempts: 5
