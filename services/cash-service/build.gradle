plugins {
	id 'org.springframework.boot'
	id 'org.springframework.cloud.contract'
	id 'maven-publish'
}

contracts {
	baseClassForTests = 'ru.yandex.practicum.mybank.cash.contracts.ContractsBase'
}

publishing {
	publications {
		stubs(MavenPublication) {
			artifact verifierStubsJar
		}
	}
}

dependencies {
	implementation project(':bank-chassis-web')
	implementation project(':bank-chassis-client')
	implementation project(':bank-persistence-starter')
	implementation project(':bank-notifications-outbox-starter')

	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-liquibase'

	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:postgresql'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-verifier'
	testImplementation 'org.springframework.cloud:spring-cloud-starter-contract-stub-runner'
	testImplementation 'org.wiremock:wiremock-standalone'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
