spring:
  cloud:
    contract:
      stubrunner:
        cloud:
          enabled: false
  application:
    name: cash-service
  jackson:
    default-property-inclusion: non_null
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  security:
    oauth2:
      client:
        registration:
          accounts-service:
            provider: keycloak
            client-id: cash-service
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: transactions:write
        provider:
          keycloak:
            token-uri: http://localhost/realms/my-bank/protocol/openid-connect/token

mybank:
  clients:
    base-urls:
      accounts-service: http://localhost:8082
  notifications:
    outbox:
      enabled: false
      poll-interval: 5s
      batch-size: 20
      stale-timeout: 5m
      max-attempts: 5

management:
  zipkin:
    tracing:
      export:
        enabled: false
