spring:
  application:
    name: transfer-service
  config:
    import:
      - "classpath:bank-chassis-defaults.yml"
      - "classpath:bank-persistence-defaults.yml"
  datasource:
    url: jdbc:postgresql://localhost:5432/my_bank_app
    username: transfer_service
    password: ${TRANSFER_DB_PASSWORD:transfer}
  jpa:
    properties:
      hibernate:
        default_schema: transfer
  liquibase:
    default-schema: transfer
  security:
    oauth2:
      resourceserver:
        jwt:
          audiences: transfer-service
      client:
        registration:
          accounts-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: ${TRANSFER_SERVICE_SECRET:transfer-service-secret}
            authorization-grant-type: client_credentials
            scope: transactions:write
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        delivery.timeout.ms: 8000
        request.timeout.ms: 3000
        max.block.ms: 3000

mybank:
  transfer:
    pending-timeout: 30s
  clients:
    base-urls:
      accounts-service: http://localhost:8082

resilience4j:
  circuitbreaker:
    instances:
      accounts-service:
        base-config: default

server:
  port: 8085
