apiVersion: v1
kind: Pod
metadata:
  name: elk-health-test
  labels:
    {{- include "elk.labels" (dict "root" . "name" "elk") | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          health=$(curl --fail --silent --max-time 5 \
            http://elk-elasticsearch:{{ .Values.elasticsearch.port }}/_cluster/health)
          echo "$health"
          echo "$health" | grep -qE '"status":"(green|yellow)"'
          curl --fail --silent --output /dev/null --max-time 5 \
            http://elk-kibana:{{ .Values.kibana.port }}/api/status
          echo "elk components are healthy"
