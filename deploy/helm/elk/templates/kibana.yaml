{{- $labels := dict "root" . "name" "elk-kibana" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elk-kibana
  labels:
    {{- include "elk.labels" $labels | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "elk.selectorLabels" $labels | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "elk.labels" $labels | nindent 8 }}
    spec:
      containers:
        - name: kibana
          image: {{ .Values.kibana.image }}
          ports:
            - name: http
              containerPort: {{ .Values.kibana.port }}
              protocol: TCP
          env:
            - name: ELASTICSEARCH_HOSTS
              value: http://elk-elasticsearch:{{ .Values.elasticsearch.port }}
            - name: TELEMETRY_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kibana.resources | nindent 12 }}
      volumes: []
---
apiVersion: v1
kind: Service
metadata:
  name: elk-kibana
  labels:
    {{- include "elk.labels" $labels | nindent 4 }}
spec:
  selector:
    {{- include "elk.selectorLabels" $labels | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.kibana.port }}
      targetPort: http
      protocol: TCP
---
{{- if .Values.kibana.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: elk-kibana
  labels:
    {{- include "elk.labels" $labels | nindent 4 }}
spec:
  ingressClassName: {{ .Values.kibana.ingress.className }}
  rules:
    - host: {{ .Values.kibana.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: elk-kibana
                port:
                  number: {{ .Values.kibana.port }}
{{- end }}
