image: openzipkin/zipkin-slim:3.6

replicaCount: 1

service:
  port: 9411

javaOpts: "-Xms128m -Xmx256m"

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: zipkin.127.0.0.1.nip.io

tests:
  image: curlimages/curl:8.11.1
