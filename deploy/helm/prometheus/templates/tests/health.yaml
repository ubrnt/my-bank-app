apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bank-common.name" . }}-health-test
  labels:
    {{- include "bank-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          base=http://{{ include "bank-common.name" . }}:{{ .Values.service.port }}
          curl --fail --silent --max-time 5 "$base/-/ready"

          attempt=1
          until curl --fail --silent --max-time 5 "$base/api/v1/targets?state=active" \
              | grep -q '"job":"my-bank-pods"'; do
            [ "$attempt" -lt 30 ] || { echo "no active my-bank-pods targets"; exit 1; }
            attempt=$((attempt + 1))
            sleep 2
          done

          echo "prometheus scrapes my-bank pods"
