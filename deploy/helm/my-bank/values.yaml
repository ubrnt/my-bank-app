accounts-service:
  enabled: true

notifications-service:
  enabled: true

cash-service:
  enabled: true

transfer-service:
  enabled: true

ingress:
  enabled: true
  className: nginx
  routes:
    - path: /api/customers
      service: accounts-service
      port: 8082
    - path: /api/cash
      service: cash-service
      port: 8084
    - path: /api/transfers
      service: transfer-service
      port: 8085
