replicaCount: 1

image:
  repository: my-bank/accounts-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  port: 8082

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

env:
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 3
  failureThreshold: 40

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: http
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: http
  periodSeconds: 20

tests:
  image: curlimages/curl:8.11.1

existingSecret: ""

secrets:
  ACCOUNTS_DB_PASSWORD: ""
  ACCOUNTS_SERVICE_SECRET: accounts-service-secret

database:
  image: postgres:17-alpine
  name: accounts
  user: accounts_service
  schema: accounts
  passwordSecretKey: ACCOUNTS_DB_PASSWORD
  storage: 1Gi

config:
  spring:
    datasource:
      url: jdbc:postgresql://{{ include "bank-common.databaseName" . }}:5432/accounts
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8180/realms/my-bank
            jwk-set-uri: http://host.minikube.internal:8180/realms/my-bank/protocol/openid-connect/certs
        client:
          provider:
            keycloak:
              token-uri: http://host.minikube.internal:8180/realms/my-bank/protocol/openid-connect/token
  mybank:
    clients:
      base-urls:
        notifications-service: http://notifications-service:8083
