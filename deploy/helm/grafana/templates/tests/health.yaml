apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bank-common.name" . }}-health-test
  labels:
    {{- include "bank-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          health=$(curl --fail --silent --max-time 5 \
            http://{{ include "bank-common.name" . }}:{{ .Values.service.port }}/api/health)
          echo "$health"
          echo "$health" | grep -qE '"database":[[:space:]]*"ok"'
