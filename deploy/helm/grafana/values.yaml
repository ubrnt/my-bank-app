image: grafana/grafana:13.1.4

replicaCount: 1

service:
  port: 3000

adminUser: admin
adminPassword: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 768Mi

alerts:
  errorShare: 5
  p95Seconds: 1
  failedWithdrawals: 3
  failedTransfers: 3

ingress:
  enabled: true
  className: nginx
  host: grafana.127.0.0.1.nip.io

tests:
  image: curlimages/curl:8.11.1
