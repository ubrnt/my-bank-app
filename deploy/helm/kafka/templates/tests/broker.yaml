apiVersion: v1
kind: Pod
metadata:
  name: {{ include "bank-common.name" . }}-broker-test
  labels:
    {{- include "bank-common.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: broker
      image: {{ .Values.tests.image }}
      command:
        - sh
        - -c
        - |
          set -e
          bootstrap={{ include "bank-common.name" . }}:{{ .Values.service.port }}
          topic=helm-test-$RANDOM

          /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$bootstrap" > /dev/null
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" \
            --create --topic "$topic" --partitions 1 --replication-factor {{ .Values.config.defaultReplicationFactor }}
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --describe --topic "$topic"
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$bootstrap" --delete --topic "$topic"

          echo "broker at $bootstrap accepts topic operations"
