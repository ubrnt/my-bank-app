spring:
  jackson:
    default-property-inclusion: non_null

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
  level:
    ru.yandex.practicum.mybank: DEBUG
