spring:
  datasource:
    username: transfer_service
    password: ${TRANSFER_DB_PASSWORD:transfer}
  security:
    oauth2:
      client:
        registration:
          accounts-service:
            provider: keycloak
            client-id: transfer-service
            client-secret: ${TRANSFER_SERVICE_SECRET:transfer-service-secret}
            authorization-grant-type: client_credentials
            scope: transactions:write
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: transfer
  liquibase:
    default-schema: transfer

resilience4j:
  circuitbreaker:
    instances:
      accounts-service:
        base-config: default
