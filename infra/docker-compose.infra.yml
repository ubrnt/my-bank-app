name: my-bank-infra

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: my_bank_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:-accounts}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-notifications}
      CASH_DB_PASSWORD: ${CASH_DB_PASSWORD:-cash}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d my_bank_app"]
      interval: 5s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.21
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0 -data-dir=/consul/data
    ports:
      - "8500:8500"
    volumes:
      - consul-data:/consul/data
    healthcheck:
      test: ["CMD-SHELL", "consul members | grep -q alive"]
      interval: 5s
      timeout: 5s
      retries: 10

  consul-kv-init:
    image: hashicorp/consul:1.21
    depends_on:
      consul:
        condition: service_healthy
    volumes:
      - ./consul:/seed:ro
    entrypoint: ["/bin/sh", "/seed/load-kv.sh"]

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  postgres-data:
  consul-data:
